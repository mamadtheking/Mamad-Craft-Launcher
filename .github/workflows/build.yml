name: Build Mamad Craft Launcher

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build EXE
        run: npm run dist:win

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Mamad-Craft-Launcher-Windows
          path: |
            dist/*.exe
            release/*.exe
